[project]
name = "plangraph"
version = "0.1.0"
description = "Connected planning copilot: ERP data -> knowledge graph -> ML alerts -> GraphRAG agent"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "neo4j>=5.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.32",
    "pyyaml>=6.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "streamlit>=1.36",
    "streamlit-agraph>=0.0.45",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plangraph"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter already wraps code; long SQL strings are fine

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs running Postgres and Neo4j (deselect with -m 'not integration')"]
